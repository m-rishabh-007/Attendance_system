# Face Attendance System - Configuration File
# Version 4.0 - Async Multiprocessing Pipeline with NCNN Support
# All paths are relative to project root

# =============================================================================
# PIPELINE CONFIGURATION (Async Multiprocessing)
# =============================================================================
pipeline:
  # Enable async multiprocessing (Producer-Consumer pattern)
  async_mode: true
  
  # Leaky bucket queue size (max buffered faces)
  # If worker is slow, frames are dropped (fail fast, camera keeps running)
  face_queue_size: 5
  
  # Enable result annotations (show recognized names on frames)
  enable_result_annotations: true

# =============================================================================
# DETECTOR CONFIGURATION (Factory Pattern)
# =============================================================================
detector:
  # Detector type: 'yolo' (Ultralytics with multiple backend support)
  type: yolo
  
  # --- RUNTIME SELECTION ---
  # Choose runtime: 'tflite' | 'ncnn' | 'pt'
  #
  # TFLite (INT8): Good for initial testing (slower on Pi)
  # NCNN (FP16): 2-3x faster on Pi 5 (recommended for production)
  # PT (FP32): PyTorch format (testing only, slow on CPU)
  runtime: ncnn
  
  # Model path (file for tflite/pt, folder for ncnn)
  # TFLite: models/detection/yolov8n_face_int8.tflite
  # NCNN: models/detection/yolov8n_ncnn_model
  model_path: models/detection/yolov8n_ncnn_model
  
  # Detection parameters
  confidence_threshold: 0.5
  iou_threshold: 0.3
  
  # Input size (320 recommended for NCNN on Pi 5)
  # 256: Fastest but may miss distant faces
  # 320: Sweet spot (30+ FPS on Pi 5 with NCNN)
  # 416: Better accuracy, slower (~15-20 FPS)
  # 640: Highest accuracy, too slow for real-time (~8-10 FPS)
  input_size: 320
  
  # Legacy TFLite-specific settings (ignored by NCNN)
  tflite:
    num_threads: 4
    delegate: null

# =============================================================================
# TRACKER CONFIGURATION (Strategy Pattern)
# =============================================================================
tracker:
  type: botsort
  
  # Tracking parameters
  track_thresh: 0.5
  track_buffer: 120
  match_thresh: 0.3
  frame_rate: 30

# =============================================================================
# ALIGNER CONFIGURATION (Phase 2 - Face Alignment)
# =============================================================================
aligner:
  type: mediapipe
  
  # Alignment parameters
  output_size: [112, 112]
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  refine_landmarks: false

# =============================================================================
# CAMERA CONFIGURATION
# =============================================================================
camera:
  device_id: 1
  resolution:
    width: null
    height: null
  fps: null

# =============================================================================
# DISPLAY CONFIGURATION
# =============================================================================
display:
  show_window: true
  window_name: "Face Attendance System v3.0"
  show_fps: true
  show_track_ids: true
  show_confidence: true
  
  # Colors (BGR format)
  bbox_color: [0, 255, 0]
  text_color: [0, 255, 0]
  font_scale: 0.6
  thickness: 2

# =============================================================================
# PERFORMANCE CONFIGURATION
# =============================================================================
performance:
  process_every_n_frames: 1
  max_fps: null

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  console_level: INFO
  file_level: DEBUG
  log_dir: production/logs
  stats_interval: 50

# =============================================================================
# EVENT SYSTEM CONFIGURATION (Observer Pattern)
# =============================================================================
events:
  enabled: true
  history_size: 100
  
  subscriptions:
    face_detected: true
    face_lost: true
    face_recognized: false
    attendance_marked: false

# =============================================================================
# RECOGNITION CONFIGURATION (Phase 3 - Face Recognition)
# =============================================================================
recognition:
  enabled: true
  
  # Model configuration
  model_type: auraface
  model_path: models/recognition/auraface_resnet100_fp32.onnx
  backbone: resnet100
  embedding_size: 512
  input_size: [112, 112]
  
  # Inference backend
  backend: onnxruntime
  device: cpu
  num_threads: 4
  
  # Recognition parameters
  similarity_threshold: 0.6
  distance_metric: cosine
  
  # Quality-aware caching (Week 2)
  enable_cache: true
  min_quality_threshold: 0.5  # Lowered for benchmark (was 0.6)
  
  cache:
    ttl_seconds: 300  # 5 minutes
    sample_size: 10  # Sample first 10 frames per person
    upgrade_threshold: 0.1  # 10% quality improvement required
    max_size: 1000  # Max 1000 tracked faces
  
  # Quality scoring weights (must sum to 1.0)
  quality_weights:
    sharpness: 0.30
    brightness: 0.20
    angle: 0.25
    size: 0.15
    confidence: 0.10

# =============================================================================
# DATABASE CONFIGURATION (Phase 3C - Week 3)
# =============================================================================
database:
  type: sqlite
  path: data/faces.db
  max_enrolled: 1000
  max_faces_per_person: 5
  enable_fuzzy_match: false

# =============================================================================
# ATTENDANCE CONFIGURATION (Phase 4)
# =============================================================================
attendance:
  enabled: false
  database_path: data/attendance.db
  auto_mark: false
  cooldown_minutes: 60
