# Face Attendance System - Configuration File
# Version 3.0 - Refactored with OOP and Design Patterns
# All paths are relative to project root

# =============================================================================
# DETECTOR CONFIGURATION (Factory Pattern)
# =============================================================================
detector:
  # Detector type: 'yolo' (Ultralytics with TFLite backend)
  type: yolo
  
  # Model path (relative to project root)
  model_path: models/detection/yolov8n_face_int8.tflite
  
  # Detection parameters
  confidence_threshold: 0.5
  iou_threshold: 0.3
  input_size: 256
  
  # TFLite-specific settings
  tflite:
    num_threads: 3
    delegate: null

# =============================================================================
# TRACKER CONFIGURATION (Strategy Pattern)
# =============================================================================
tracker:
  type: botsort
  
  # Tracking parameters
  track_thresh: 0.5
  track_buffer: 120
  match_thresh: 0.3
  frame_rate: 30

# =============================================================================
# ALIGNER CONFIGURATION (Phase 2 - Face Alignment)
# =============================================================================
aligner:
  type: mediapipe
  
  # Alignment parameters
  output_size: [112, 112]
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  refine_landmarks: false

# =============================================================================
# CAMERA CONFIGURATION
# =============================================================================
camera:
  device_id: 1
  resolution:
    width: null
    height: null
  fps: null

# =============================================================================
# DISPLAY CONFIGURATION
# =============================================================================
display:
  show_window: true
  window_name: "Face Attendance System v3.0"
  show_fps: true
  show_track_ids: true
  show_confidence: true
  
  # Colors (BGR format)
  bbox_color: [0, 255, 0]
  text_color: [0, 255, 0]
  font_scale: 0.6
  thickness: 2

# =============================================================================
# PERFORMANCE CONFIGURATION
# =============================================================================
performance:
  process_every_n_frames: 1
  max_fps: null

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  console_level: INFO
  file_level: DEBUG
  log_dir: production/logs
  stats_interval: 50

# =============================================================================
# EVENT SYSTEM CONFIGURATION (Observer Pattern)
# =============================================================================
events:
  enabled: true
  history_size: 100
  
  subscriptions:
    face_detected: true
    face_lost: true
    face_recognized: false
    attendance_marked: false

# =============================================================================
# RECOGNITION CONFIGURATION (Phase 3 - Face Recognition)
# =============================================================================
recognition:
  enabled: true
  
  # Model configuration
  model_type: auraface
  model_path: models/recognition/auraface_resnet100_fp32.onnx
  backbone: resnet100
  embedding_size: 512
  input_size: [112, 112]
  
  # Inference backend
  backend: onnxruntime
  device: cpu
  num_threads: 4
  
  # Recognition parameters
  similarity_threshold: 0.6
  distance_metric: cosine
  
  # Quality-aware caching (Week 2)
  enable_cache: true
  quality_sampling_frames: 10
  min_quality_threshold: 0.6
  quality_improvement_delta: 0.1
  cache_ttl_seconds: 300
  
  # Quality scoring weights (must sum to 1.0)
  quality_weights:
    sharpness: 0.30
    brightness: 0.20
    angle: 0.25
    size: 0.15
    confidence: 0.10

# =============================================================================
# DATABASE CONFIGURATION (Phase 3C - Week 3)
# =============================================================================
database:
  type: sqlite
  path: data/faces.db
  max_enrolled: 1000
  max_faces_per_person: 5
  enable_fuzzy_match: false

# =============================================================================
# ATTENDANCE CONFIGURATION (Phase 4)
# =============================================================================
attendance:
  enabled: false
  database_path: data/attendance.db
  auto_mark: false
  cooldown_minutes: 60
